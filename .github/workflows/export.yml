name: Export BOE

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      start_date:
        description: Start date (YYYY-MM-DD); defaults to 13 days before end_date
        required: false
        type: string
      end_date:
        description: End date (YYYY-MM-DD); defaults to today
        required: false
        type: string

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Run tests
        run: make test

      - name: Resolve date range
        id: dates
        env:
          INPUT_START_DATE: ${{ inputs.start_date }}
          INPUT_END_DATE: ${{ inputs.end_date }}
        run: |
          end_date="${INPUT_END_DATE:-$(date -u +%F)}"
          start_date="${INPUT_START_DATE:-$(date -u -d "$end_date - 13 days" +%F)}"
          date -u -d "$start_date" +%F >/dev/null
          date -u -d "$end_date" +%F >/dev/null
          echo "start_date=$start_date" >> "$GITHUB_OUTPUT"
          echo "end_date=$end_date" >> "$GITHUB_OUTPUT"

      - name: Download BOE PDFs
        run: |
          uv run --locked boe.py \
            --start-date "${{ steps.dates.outputs.start_date }}" \
            --end-date "${{ steps.dates.outputs.end_date }}"

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if make upload; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 60))"
          done
